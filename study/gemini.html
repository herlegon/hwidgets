<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herlegon Convert - Study</title>
    <style>
        :root {
            /* Palette: Indigo / Blue */
            --primary-color: #3f51b5; /* Indigo 500 */
            --primary-light: #7986cb; /* Indigo 300 */
            --primary-dark: #303f9f; /* Indigo 700 */
            --accent-color: #536dfe; /* Indigo A200 */

            --bg-color: #121212; /* Material Dark Background */
            --surface-color: #1e1e1e; /* Material Dark Surface */
            --surface-color-elevated: #2d2d2d;

            --text-primary: #ffffff; /* High emphasis */
            --text-secondary: rgba(255, 255, 255, 0.7); /* Medium emphasis */
            --text-disabled: rgba(255, 255, 255, 0.5);

            --border-color: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, h3 {
            margin: 0;
            font-weight: 500;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .header h1 {
            color: #e8eaf6; /* Indigo 50 - Nearly white */
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .main-content {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            background-color: var(--surface-color-elevated);
        }

        .card-header {
            background-color: rgba(63, 81, 181, 0.15); /* Primary with opacity */
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h2 {
            font-size: 18px;
            color: var(--primary-light);
        }

        .card-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        input[type="text"], select, textarea {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s;
            align-self: flex-start;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .icon-placeholder {
            width: 24px;
            height: 24px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            opacity: 0.8;
        }

        /* Specific tweaks for the blocks */
        .block-pytorch .card-header { border-left: 4px solid #ee4c2c; } /* PyTorch orange accent */
        .block-metadata .card-header { border-left: 4px solid var(--accent-color); }
        .block-conversion .card-header { border-left: 4px solid #4caf50; } /* Green for action */

    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>Herlegon Convert</h1>
        </div>

        <div class="main-content">
            <!-- Block 1: PyTorch Description -->
            <div class="card block-pytorch">
                <div class="card-header">
                    <span class="icon-placeholder" style="background-color: #ee4c2c;"></span>
                    <h2>PyTorch</h2>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Model Path</label>
                        <input type="text" value="/path/to/model.pth" readonly>
                    </div>
                    <div class="form-group">
                        <label>Architecture</label>
                        <input type="text" value="ResNet50" readonly>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea rows="3" readonly>PyTorch model loaded successfully. Ready for conversion analysis.</textarea>
                    </div>
                </div>
            </div>

            <!-- Block 2: Metadata -->
            <div class="card block-metadata">
                <div class="card-header">
                    <span class="icon-placeholder"></span>
                    <h2>Metadata</h2>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" placeholder="Enter author name">
                    </div>
                    <div class="form-group">
                        <label>Version</label>
                        <input type="text" placeholder="1.0.0">
                    </div>
                    <div class="form-group">
                        <label>Tags</label>
                        <input type="text" placeholder="vision, classification">
                    </div>
                </div>
            </div>

            <!-- Block 3: Conversion -->
            <div class="card block-conversion">
                <div class="card-header">
                    <span class="icon-placeholder" style="background-color: #4caf50;"></span>
                    <h2>Conversion</h2>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Target Format</label>
                        <select>
                            <option>ONNX</option>
                            <option>TensorRT</option>
                            <option>CoreML</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Precision</label>
                        <select>
                            <option>FP32</option>
                            <option>FP16</option>
                            <option>INT8</option>
                        </select>
                    </div>
                    <div style="margin-top: auto;">
                         <button class="btn" style="width: 100%;">Convert</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
