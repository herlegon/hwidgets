[window]
window = "#303034"


[common]
bgd = "#4F4D53"
hover = "#66636D"
selection = "#5545bd"
pressed = "#5555B3"
disabled_bgd = "#313131"
border = "#505053"

font_family = "Segoe UI"
font_size = 10
font_weight = 500
font_color = "#d4d4d8"
font_color_disabled = "#4E4E4E"
font_color_selected = "#5442bd"
font_color_checked = "#4632c7"


[divider]
normal ="#3B3B3B"

[button]
normal = "#5442bd"
hover = "#7777FF"
disabled = "#A3A3D1"


[flat_button]
normal = "#5442bd"
disabled = "#A3A3D1"


[icon_button]
# normal = icon line color
normal = "#5442bd"
disabled = "#A3A3D1"

[checkbox]
size = 16
border = "#7c787f"
pressed = "#7c787f"
checked = "#7053D6"
disabled = "#474747"

[switch]
size = 16
border = "#7c787f"
pressed = "#7c787f"
checked = "#7053D6"
disabled = "#474747"


[radio]
checked = "#7C5CD8"

[progress_bar]
track = "#A3A3D1"
bar = "#5442bd"

[button_label]
font_size = 12
font_weight = 500


[label]
font_family = "Segoe UI"
font_size = 10
font_weight = 400
font_color = "#f0f0f0"

[title]
font_family = "Segoe UI"
font_size = 16
font_weight = 800
font_color = "#7c5cd8"

# subtitle and comment only appear in TOML if they override label
[subtitle]
font_size = 14
font_weight = 600
font_color = "#f0f0f0"
# Inherits everything from [label], font is defined in code

[description]
font_size = 10
font_weight = 400
font_color = "#f0f0f0"


[comment]
font_size = 8
font_color = "#a7a7a7ff"
# Inherits font_color_disabled from label

